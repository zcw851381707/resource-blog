<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>感谢墙 v5 - 真数据打乱版</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", sans-serif; background: #f5f5f3; padding: 32px; margin: 0; color: #1a1a1a; }
  .card { max-width: 1080px; margin: 0 auto; background: #fff; border-radius: 28px; padding: 60px 44px 40px; box-shadow: 0 1px 0 rgba(0,0,0,0.04); position: relative; overflow: hidden; }
  .card::before { content: "♥"; position: absolute; top: -50px; right: -30px; font-size: 340px; color: #fff5f4; line-height: 1; pointer-events: none; z-index: 0; }
  .inner { position: relative; z-index: 1; }
  
  .head { text-align: center; margin-bottom: 36px; }
  .small-label { display: inline-block; font-size: 11px; color: #C8283C; letter-spacing: 6px; font-weight: 600; padding-bottom: 12px; }
  .title { font-size: 30px; font-weight: 800; color: #1a1a1a; letter-spacing: 4px; margin-bottom: 24px; }
  .quote { color: #4a4a4a; font-size: 15px; line-height: 2.1; max-width: 600px; margin: 0 auto; letter-spacing: 0.3px; }
  .quote em { color: #C8283C; font-style: normal; font-weight: 600; }
  .sign { color: #b8b0b0; font-size: 12px; letter-spacing: 3px; margin-top: 18px; }
  
  .walls { background: linear-gradient(180deg, #fafaf8 0%, #fff 100%); border-radius: 20px; padding: 22px 0; margin-bottom: 28px; overflow: hidden; }
  .row { display: flex; gap: 18px; margin-bottom: 14px; }
  .row:last-child { margin-bottom: 0; }
  .row-inner { display: flex; gap: 18px; flex-shrink: 0; animation-timing-function: linear; animation-iteration-count: infinite; }
  .row-1 .row-inner { animation-name: scrollL; animation-duration: 80s; }
  .row-2 .row-inner { animation-name: scrollR; animation-duration: 95s; }
  @keyframes scrollL { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @keyframes scrollR { from { transform: translateX(-50%); } to { transform: translateX(0); } }
  .walls:hover .row-inner { animation-play-state: paused; }
  
  .person { display: flex; flex-direction: column; align-items: center; width: 64px; flex-shrink: 0; }
  .avatar { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #FFC8C0 0%, #C8283C 100%); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 600; font-size: 15px; margin-bottom: 6px; box-shadow: 0 3px 10px rgba(200,40,60,0.18); border: 2.5px solid #fff; transition: transform 0.25s; overflow: hidden; position: relative; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .person:hover .avatar { transform: translateY(-3px) scale(1.05); box-shadow: 0 6px 16px rgba(200,40,60,0.28); }
  .name { font-size: 11px; color: #4a4a4a; max-width: 64px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; }
  
  .footer { display: flex; align-items: center; justify-content: center; gap: 14px; }
  .count-num { color: #C8283C; font-size: 30px; font-weight: 800; letter-spacing: -1px; }
  .count-text { color: #888; font-size: 13px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 30px; background: linear-gradient(135deg, #FF8A80 0%, #C8283C 100%); color: #fff; border-radius: 999px; font-size: 14px; font-weight: 600; letter-spacing: 2px; cursor: pointer; box-shadow: 0 6px 20px rgba(200,40,60,0.28); border: none; transition: all 0.25s; }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(200,40,60,0.38); }
</style>
</head>
<body>

        愿下一个 7 年，我们还能继续在这片光影里相遇。
      </p>
      <p class="sign">— 致每一位陪晨光曦走到这里的人 —</p>
