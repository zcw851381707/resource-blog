<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>感谢墙设计稿</title>
<style>
  body { font-family: -apple-system, "PingFang SC", sans-serif; background: #f5f5f5; padding: 24px; margin: 0; }
  .design { max-width: 1100px; margin: 0 auto 32px; background: #fff; border-radius: 16px; padding: 40px 36px; }
  .head { text-align: center; margin-bottom: 28px; }
  .title { font-size: 22px; font-weight: 700; color: #C8283C; letter-spacing: 4px; margin-bottom: 14px; }
  .sub-line { display: inline-block; height: 2px; width: 32px; background: #C8283C; margin-bottom: 18px; }
  .quote { color: #555; font-size: 14px; line-height: 1.9; max-width: 640px; margin: 0 auto 8px; letter-spacing: 0.3px; }
  .quote em { color: #C8283C; font-style: normal; font-weight: 600; }
  .hint { color: #999; font-size: 12px; letter-spacing: 1px; margin-top: 12px; }
  
  .wall { display: flex; flex-wrap: wrap; gap: 14px 18px; justify-content: center; padding: 28px 16px; background: linear-gradient(180deg, #fafafa 0%, #fff 100%); border-radius: 14px; margin-bottom: 24px; }
  .person { display: flex; flex-direction: column; align-items: center; width: 64px; transition: transform 0.2s; }
  .person:hover { transform: translateY(-3px); }
  .avatar { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #FFD3CD, #C8283C); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 600; font-size: 17px; margin-bottom: 6px; box-shadow: 0 2px 8px rgba(200,40,60,0.15); border: 2px solid #fff; }
  .name { font-size: 12px; color: #666; max-width: 64px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  
  .footer { display: flex; align-items: center; justify-content: center; gap: 14px; padding-top: 6px; }
  .count-num { color: #C8283C; font-size: 24px; font-weight: 700; }
  .count-text { color: #888; font-size: 13px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 22px; background: linear-gradient(135deg, #FF8A80, #C8283C); color: #fff; border-radius: 24px; font-size: 13px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 12px rgba(200,40,60,0.25); transition: transform 0.2s; }
  .btn:hover { transform: translateY(-1px); }
</style>
</head>
<body>

<div class="design">
  <div class="head">
    <div class="title">感 谢 墙</div>
    <div class="sub-line"></div>
    <p class="quote">
      晨光曦 能走到今天，离不开每一位站友的陪伴与支持。<br>
      你们每一次<em>点击</em>、每一次<em>收藏</em>、每一次<em>评论</em>，都是我继续前行的动力。<br>
      愿我们继续在这片光影里相遇。
    </p>
    <p class="hint">—  致每一位陪晨光曦走到这里的人  —</p>
  </div>
  
  <div class="wall">
    <div class="person"><div class="avatar">小</div><div class="name">小明</div></div>
    <div class="person"><div class="avatar">曦</div><div class="name">晨光曦</div></div>
    <div class="person"><div class="avatar">阿</div><div class="name">阿星</div></div>
    <div class="person"><div class="avatar">林</div><div class="name">林夕</div></div>
    <div class="person"><div class="avatar">梦</div><div class="name">梦璃</div></div>
    <div class="person"><div class="avatar">深</div><div class="name">深夜追剧人</div></div>
    <div class="person"><div class="avatar">空</div><div class="name">空白格</div></div>
    <div class="person"><div class="avatar">周</div><div class="name">周周</div></div>
    <div class="person"><div class="avatar">阳</div><div class="name">阳光</div></div>
    <div class="person"><div class="avatar">夜</div><div class="name">夜空</div></div>
    <div class="person"><div class="avatar">星</div><div class="name">星尘</div></div>
    <div class="person"><div class="avatar">小</div><div class="name">小红</div></div>
    <div class="person"><div class="avatar">追</div><div class="name">追剧人</div></div>
    <div class="person"><div class="avatar">剧</div><div class="name">剧迷</div></div>
    <div class="person"><div class="avatar">迷</div><div class="name">迷妹</div></div>
    <div class="person"><div class="avatar">天</div><div class="name">天涯</div></div>
    <div class="person"><div class="avatar">海</div><div class="name">海角</div></div>
    <div class="person"><div class="avatar">梦</div><div class="name">梦里</div></div>
    <div class="person"><div class="avatar">星</div><div class="name">星河</div></div>
    <div class="person"><div class="avatar">月</div><div class="name">月亮</div></div>
    <div class="person"><div class="avatar">小</div><div class="name">小七</div></div>
    <div class="person"><div class="avatar">阿</div><div class="name">阿狸</div></div>
    <div class="person"><div class="avatar">空</div><div class="name">空气</div></div>
    <div class="person"><div class="avatar">林</div><div class="name">林深</div></div>
  </div>
  
  <div class="footer">
    <span class="count-num">1,247</span>
    <span class="count-text">位站友的支持</span>
    <button class="btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      一起支持
    </button>
  </div>
</div>

</body>
</html>
